name: install-drift

# The install one-liner in the README and the quickstart pipes a script served
# from two hosts. install.sh in this repo is the reviewable copy; this job
# fails when either host stops matching it — a forgotten redeploy, a
# divergence between the hosts, or a change nobody reviewed here.
#
# It never runs on an unrelated pull request: a host is deployed separately
# from this repo, so a red drift check is a signal about infrastructure, not a
# reason to block someone's code. It runs daily, on changes to install.sh
# itself, and on demand.
on:
  schedule:
    - cron: "17 7 * * *"
  push:
    branches: [main]
    paths: ["install.sh", ".github/workflows/install-drift.yml"]
  pull_request:
    paths: ["install.sh", ".github/workflows/install-drift.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosts-match-repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Compare both hosts against install.sh
        run: |
          want="$(sha256sum install.sh | cut -d' ' -f1)"
          echo "repo install.sh: $want"
          rc=0
          for url in https://dabs.dev/install.sh https://get.dabs.dev; do
            if ! curl -fsSL "$url" -o /tmp/served; then
              echo "FAIL $url — could not be fetched"
              rc=1
              continue
            fi
            got="$(sha256sum /tmp/served | cut -d' ' -f1)"
            if [ "$got" = "$want" ]; then
              echo "ok   $url"
            else
              echo "FAIL $url serves $got"
              diff -u install.sh /tmp/served || true
              rc=1
            fi
          done
          if [ "$rc" -ne 0 ]; then
            echo "A host serves a script that is not the one in this repo."
            echo "Redeploy it from install.sh, or bring the change here for review."
          fi
          exit "$rc"
